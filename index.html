<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladik Harita & Rehber Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
</head>
<body>
    <nav class="navbar">
        <div class="logo">Ladik Rehberi</div>
        <div class="nav-links">
            <a href="index.html" class="active">Harita</a>
            <a href="admin.html">Yönetici Girişi</a>
        </div>
    </nav>

    <div class="container">
        <div class="sidebar">
            <h2>Rota Planlama</h2>
            
            <div class="input-group">
                <label>Başlangıç Noktası (Örn: Şehreküstü)</label>
                <select id="startPoint">
                    <option value="">Seçiniz...</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Varış Noktası (Örn: Kızılsini)</label>
                <select id="endPoint">
                    <option value="">Seçiniz...</option>
                </select>
            </div>

            <button id="calcRouteBtn" class="primary-btn">Yolu Göster (Mavi & Kırmızı)</button>
            <button id="detailBtn" class="info-btn">Seçili Yerlerin Detaylı Bilgisi</button>
            
            <div class="results" id="resultsPanel" style="display: none;">
                <h3>Mesafe Bilgileri</h3>
                <p><strong>Yeni Yol (Mavi):</strong> <span id="newDistance">-</span> km</p>
                <p><strong>Eski Yol (Kırmızı):</strong> <span id="oldDistance">-</span> km</p>
            </div>
        </div>
        <div id="map" class="map-container"></div>
    </div>

    <!-- Modal for Detailed Info -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Detaylı Bilgi</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
